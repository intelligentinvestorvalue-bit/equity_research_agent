<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ ticker }} research</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260724" />
</head>
<body>
  {% set active_nav = active_nav or 'research' %}
  {% include "partials/nav.html" %}
  <main class="wrap wide">
    <header>
      <p class="brand">{{ ticker }}</p>
      <p class="sub">Mode: {{ mode }} · Job {{ job_id[:8] }}…</p>
    </header>

    <div id="panel" class="panel">
      <p id="state" class="status">Starting…</p>
      <p id="detail" class="fine"></p>
      <div class="bar"><div id="fill"></div></div>
    </div>

    <section class="think-panel" aria-label="Thinking">
      <p class="scenario-label">Thinking</p>
      <ul id="thoughts" class="thought-list"></ul>
    </section>

    <section class="think-panel" id="pack-panel" hidden aria-label="Pack progress">
      <p class="scenario-label">Template pack</p>
      <ul id="pack-list" class="recent-list"></ul>
    </section>

    <p><a class="link" href="/">← New research</a> · <a class="link" href="/dashboard">Dashboard</a></p>
  </main>

  <script>
    const jobId = {{ job_id|tojson }};
    const stateEl = document.getElementById("state");
    const detailEl = document.getElementById("detail");
    const fillEl = document.getElementById("fill");
    const thoughtsEl = document.getElementById("thoughts");
    const packPanel = document.getElementById("pack-panel");
    const packList = document.getElementById("pack-list");
    let lastThoughtCount = 0;

    const stageWidth = {
      queued: "8%", starting: "12%", plan: "18%", planning: "20%",
      pack: "35%", quant: "28%", valuation: "38%", web: "50%", think: "62%",
      critique: "72%", charts: "82%", sec: "70%", nlp: "88%", done: "100%", error: "100%"
    };

    function renderThoughts(thoughts) {
      if (!thoughts || thoughts.length === lastThoughtCount) return;
      lastThoughtCount = thoughts.length;
      thoughtsEl.innerHTML = "";
      thoughts.forEach((t) => {
        const li = document.createElement("li");
        li.className = `thought thought-${t.kind || "think"}`;
        const kind = document.createElement("span");
        kind.className = "thought-kind";
        kind.textContent = t.kind || "think";
        const msg = document.createElement("span");
        msg.className = "thought-msg";
        msg.textContent = t.message || "";
        li.appendChild(kind);
        li.appendChild(msg);
        thoughtsEl.appendChild(li);
      });
      thoughtsEl.scrollTop = thoughtsEl.scrollHeight;
    }

    function renderPack(data) {
      if (!data.is_pack) return;
      packPanel.hidden = false;
      const prog = data.pack_progress || {};
      const total = prog.total || 5;
      const idx = prog.index || (data.pack_reports || []).length || 0;
      fillEl.style.width = `${Math.min(95, Math.round((idx / total) * 90) + 5)}%`;
      const doneIds = new Set((data.pack_reports || []).map((r) => r.id));
      const labels = {
        memo: "Institutional deep dive (memo)",
        valuation: "Valuation",
        deep: "Full diligence",
        income: "Options income",
        fast: "Fast quant",
      };
      const order = ["memo", "valuation", "deep", "income", "fast"];
      packList.innerHTML = "";
      order.forEach((id) => {
        const row = (data.pack_reports || []).find((r) => r.id === id);
        const li = document.createElement("li");
        const status = row ? row.status : (prog.current === id ? "running" : "pending");
        li.innerHTML = `<strong>${labels[id] || id}</strong> <span class="muted">${status}</span>`;
        packList.appendChild(li);
      });
      if (prog.index && prog.total) {
        detailEl.textContent = data.message || `Pack ${prog.index}/${prog.total}`;
      }
    }

    async function tick() {
      try {
        const res = await fetch(`/api/jobs/${jobId}`);
        const data = await res.json();
        stateEl.textContent = `${data.status} · ${data.stage}`;
        detailEl.textContent = data.message || "";
        if (!data.is_pack) fillEl.style.width = stageWidth[data.stage] || "20%";
        renderThoughts(data.thoughts || []);
        renderPack(data);
        if (data.status === "completed") {
          window.location.href = `/jobs/${jobId}/report`;
          return;
        }
        if (data.status === "failed") {
          stateEl.className = "status warn";
          detailEl.textContent = data.error || data.message || "Failed";
          return;
        }
      } catch (e) {
        detailEl.textContent = "Waiting for server…";
      }
      setTimeout(tick, 1200);
    }
    tick();
  </script>
</body>
</html>
